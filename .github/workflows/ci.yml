# Vérifie Alfred sous Windows à chaque push sur main et à chaque pull request : contrôles, tests, build, tests Rust.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # socle-ui est installé en local par yalc (`.yalc/` n'est pas dans le dépôt). La CI le reconstruit depuis
  # NeKeR53/app-design, à ce commit. À mettre à jour à chaque nouvelle installation yalc de socle-ui.
  SOCLE_UI_REF: 864a48dced4e8c1abf676370d7c7561179e104dd # socle-ui 1.26.0

jobs:
  socle-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NeKeR53/app-design
          ref: ${{ env.SOCLE_UI_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design-system/package-lock.json

      - name: Construire et empaqueter socle-ui
        working-directory: design-system
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/socle"
          npm pack --pack-destination "$RUNNER_TEMP/socle"

      - uses: actions/upload-artifact@v4
        with:
          name: socle-ui
          path: ${{ runner.temp }}/socle/*.tgz
          retention-days: 1

  windows:
    needs: socle-ui
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: socle-ui
          path: socle-pack

      - name: Installer socle-ui à la place de yalc
        run: |
          mkdir -p .yalc/socle-ui
          tar -xzf socle-pack/*.tgz -C .yalc/socle-ui --strip-components=1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Contrôles (Biome, CSS, composants)
        run: pnpm check

      # Avant les tests : certains lisent la feuille du runtime des pages, produite par `pnpm build:runtime`.
      - name: Build de l'interface
        run: pnpm build

      - name: Tests de l'interface
        run: pnpm test

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
