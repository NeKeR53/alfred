<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Alfred</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c76a3b"/>
      <stop offset="1" stop-color="#8e3f1d"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d34"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f0"/>
      <stop offset="1" stop-color="#e6dfd3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/></filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g transform="translate(100 100) scale(0.8046875)">
  <rect width="1024" height="1024" rx="230" fill="#8e3f1d" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- Veste : épaules arrondies -->
    <path d="M150 1024 L150 700 Q150 470 400 400 L512 372 L624 400 Q874 470 874 700 L874 1024 Z" fill="url(#jacket)"/>
    <!-- Plastron -->
    <path d="M420 384 L604 384 L512 900 Z" fill="url(#shirt)"/>
    <!-- Revers en pointe -->
    <path d="M400 400 L512 900 L388 640 L300 560 L382 520 Z" fill="#33363e"/>
    <path d="M624 400 L512 900 L636 640 L724 560 L642 520 Z" fill="#33363e"/>
    <!-- Col cassé -->
    <path d="M512 446 L420 384 L452 470 Z" fill="#ffffff"/>
    <path d="M512 446 L604 384 L572 470 Z" fill="#ffffff"/>
    <!-- Nœud papillon -->
    <path d="M512 470 L392 412 Q372 470 392 528 Z" fill="#15171b"/>
    <path d="M512 470 L632 412 Q652 470 632 528 Z" fill="#15171b"/>
    <rect x="484" y="442" width="56" height="56" rx="16" fill="#23262c"/>
    <!-- Boutons de plastron -->
    <circle cx="512" cy="600" r="15" fill="#15171b"/>
    <circle cx="512" cy="700" r="15" fill="#15171b"/>
