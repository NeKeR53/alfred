[package]
name = "alfred"
version = "0.1.2"
description = "Coquille de bureau que l’utilisateur construit avec un agent"
authors = ["Alfred"]
edition = "2021"

[[bin]]
name = "alfred"
path = "src/main.rs"

[lib]
name = "alfred_lib"
crate-type = ["rlib"]

[features]
# Activé par `tauri build` (la CLI ajoute `tauri/custom-protocol`) : l’application embarque alors `dist/`. Sans lui,
# un binaire de développement charge l’interface du serveur Vite (`devUrl`) au lieu d’un `dist/` peut-être périmé.
custom-protocol = ["tauri/custom-protocol"]
# Banc de vérification (`src/verify.rs`) : le serveur local exécute un script dans la vraie fenêtre et y émet un dépôt de
# fichiers, protégé par un jeton écrit dans `verify.json`. Jamais dans une version distribuée.
verify = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "json"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "hooks", "backup", "functions"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic"] }
include_dir = "0.7"
notify = "8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
log = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Voix : capture du micro, réglages repris d’Argos.
cpal = "0.18"
toml = "1"
rust_xlsxwriter = { version = "0.93", default-features = false }
pdf-extract = "0.12.1"
zip = { version = "7", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
debug = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Registry"] }
