[package]
name = "alfred"
version = "0.1.2"
description = "Coquille de bureau que l’utilisateur construit avec un agent"
authors = ["Alfred"]
edition = "2021"

[[bin]]
name = "alfred"
path = "src/main.rs"

[lib]
name = "alfred_lib"
crate-type = ["rlib"]

[features]
# Activé par `tauri build` (la CLI ajoute `tauri/custom-protocol`) : l’application embarque alors `dist/`. Sans lui,
# un binaire de développement charge l’interface du serveur Vite (`devUrl`) au lieu d’un `dist/` peut-être périmé.
custom-protocol = ["tauri/custom-protocol"]
# Banc de vérification (`src/verify.rs`) : le serveur local exécute un script dans la vraie fenêtre et y émet un dépôt de
# fichiers, protégé par un jeton écrit dans `verify.json`. Jamais dans une version distribuée.
verify = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
# Transport des comptes : réponses lues en flux (téléchargements, journaux, SSE), envois multipart, proxy du système
# (macOS, « Paramètres Internet » de Windows) en plus des variables d’environnement.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "brotli", "json", "stream", "multipart", "system-proxy"] }
# WebSocket des comptes (console d’un conteneur) : la poignée de main passe par reqwest (proxy, certificats, origine),
# tungstenite ne fait que le protocole sur la connexion obtenue.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "hooks", "backup", "functions"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
oxc = { version = "=0.152.0", features = ["transformer", "codegen", "semantic", "ast_visit"] }
include_dir = "0.7"
notify = "8"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
log = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = { version = "0.1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Agents pilotés depuis Rust : client `opencode serve` généré par progenitor (src/agents/opencode/generated.rs), qui
# utilise reqwest 0.13, à côté de la 0.12 du reste d’Alfred ; motifs des types générés (regress).
progenitor-client = "0.16"
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "query", "stream"] }
regress = "0.10"
# Voix : capture du micro, réglages repris d’Argos.
cpal = "0.18"
toml = "1"
rust_xlsxwriter = { version = "0.93", default-features = false }
pdf-extract = "0.12.1"
zip = { version = "7", default-features = false, features = ["deflate"] }
candle-core = { version = "0.11", default-features = false }
candle-nn = { version = "0.11", default-features = false }
candle-transformers = { version = "0.11", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
# Réglages › Espaces de travail : un espace supprimé part à la corbeille du système, jamais définitivement.
trash = "5"
image = { version = "0.25", default-features = false, features = ["png", "webp", "ico"] }
quick-xml = "0.42"
# Modèles locaux (décisions, recherche par le sens) : le cache Hugging Face partagé avec Python (`HF_HOME`, jeton de
# `huggingface-cli login`). Le téléchargement passe par le client reqwest d’Alfred (racines du système), si bien
# que les certificats d’entreprise installés sur le poste sont acceptés.
hf-hub = { version = "=0.5.0", default-features = false }
# Racines de certificats du système (Trousseau, magasin de Windows), données aux programmes Python lancés par Alfred :
# sans elles, Python ne reconnaît pas l’autorité d’une entreprise. Déjà là par reqwest (rustls-tls-native-roots).
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
debug = 1

# Les dépendances sont optimisées même en développement : sans cela, candle (décisions locales, recherche par le
# sens), tokenizers et sha2 sont trente fois plus lents sous `pnpm tauri dev` (2 s au lieu de 70 ms par décision).
# Le code d’Alfred reste en debug ; seules les dépendances, compilées une fois, le sont en optimisé.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Sur un Mac, les décisions locales calculent sur la carte graphique (Metal).
candle-core = { version = "0.11", default-features = false, features = ["metal"] }
candle-nn = { version = "0.11", default-features = false, features = ["metal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Registry", "Win32_System_SystemInformation"] }
